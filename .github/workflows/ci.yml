name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 前端: 类型 / 风格 / 单测 / 构建
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 构建前端产物
        run: npx vite build

      # 体积回归门禁: 预算见 scripts/perf-budgets.json
      # 主入口 Gzip / JS 合计 Gzip / dist 合计 Gzip 任一超标都会让 CI 失败
      - name: 体积预算门禁
        run: npm run perf:gate

      # 快照用于留档与趋势对比(不参与门禁), 作为 CI artifact 上传
      - name: 性能数据快照
        run: npm run perf:snapshot

      - name: 上传性能快照
        uses: actions/upload-artifact@v4
        with:
          name: perf-snapshot
          path: |
            markdown/性能/性能数据快照.json
            markdown/性能/性能数据快照.md

  # Rust 侧: 格式 / Clippy / 单测
  #
  # 跑在 Windows 上: 项目依赖 src-tauri/binaries 下的 ffmpeg sidecar,
  # 且 Tauri 在 Linux 上还需要额外安装 webkit2gtk 等系统库。
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
