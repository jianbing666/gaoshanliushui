<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a3d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- 远山（后层山 -->
  <path d="M 0 380 L 80 300 L 140 340 L 220 260 L 300 320 L 380 280 L 450 340 L 512 310 L 512 512 L 0 512 Z"
        fill="#3b5998" opacity="0.4"/>

  <!-- 中景山脉 -->
  <path d="M 0 420 L 60 360 L 120 400 L 200 300 L 280 380 L 360 320 L 440 380 L 512 350 L 512 512 L 0 512 Z"
        fill="url(#mountainGradient)" opacity="0.7"/>

  <!-- 主峰（高山） -->
  <path d="M 120 420 L 220 200 L 260 280 L 320 160 L 400 320 L 420 420 Z"
        fill="url(#mountainGradient)"/>

  <!-- 山顶积雪 -->
  <path d="M 200 240 L 220 200 L 240 250 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 290 210 L 320 160 L 345 220 L 310 240 Z" fill="#ffffff" opacity="0.9"/>

  <!-- 太阳/月亮 -->
  <circle cx="380" cy="130" r="36" fill="url(#sunGradient)" filter="url(#glow)" opacity="0.9"/>

  <!-- 流水（瀑布+波浪 -->
  <g opacity="0.9">
    <!-- 瀑布 -->
    <path d="M 240 330 Q 250 380 Q 235 420 Q 255 460 Q 240 500"
          stroke="url(#waterGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 260 350 Q 270 390 Q 255 430 Q 275 470 Q 260 510"
          stroke="url(#waterGradient)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 底部水面波浪 -->
  <g>
    <path d="M 0 470 Q 60 460 120 470 T 240 470 T 360 470 T 512 470 L 512 512 L 0 512 Z"
          fill="#60a5fa" opacity="0.3"/>
    <path d="M 0 485 Q 80 475 160 485 T 320 485 T 512 485 L 512 512 L 0 512 Z"
          fill="#93c5fd" opacity="0.4"/>
  </g>

  <!-- 音乐符号点缀（高音谱号的简化抽象） -->
  <g transform="translate(100, 120)" opacity="0.15" fill="#ffffff">
    <circle cx="0" cy="30" r="12"/>
    <path d="M 0 18 Q 20 0 40 20 Q 60 40 40 60 Q 20 80 0 60 Q -10 50 -5 40"
          stroke="#ffffff" stroke-width="4" fill="none"/>
  </g>
</svg>